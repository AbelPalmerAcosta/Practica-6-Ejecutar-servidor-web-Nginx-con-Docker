<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nginx con Docker Compose</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0db7ed 0%, #17384e 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 480px;
            width: 90%;
        }
        .logo {
            font-size: 50px;
            margin-bottom: 15px;
        }
        h1 {
            color: #009639;
            font-size: 24px;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .badge-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .badge {
            background: #e6f4ea;
            color: #137333;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .badge.docker {
            background: #e8f0fe;
            color: #1a73e8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🐳</div>
        <h1>¡Hola Mundo desde Nginx!</h1>
        <p>Esta página web está corriendo en un contenedor local gestionado con <strong>Docker Compose</strong> y servida a través de un volumen montado en tiempo real.</p>
        <div class="badge-container">
            <span class="badge docker">Docker Compose</span>
            <span class="badge">Nginx Server</span>
        </div>
    </div>
</body>
</html>
